{{- if not .Values.source.existingSecret }}
{{- $s := .Values.source }}
{{- if or (not $s.bucket) (not $s.path) (not $s.accessKey) (not $s.secretKey) }}
{{- fail "set source.bucket, source.path, source.accessKey and source.secretKey, or source.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "restore.name" . }}
  labels: {{- include "restore.labels" . | nindent 4 }}
stringData:
  # Read side only: no archive-push, no backup, no retention. Nothing here can
  # change the source repo, and the keys should not be able to either.
  pgbackrest.conf: |
    [global]
    lock-path=/tmp/pgbackrest
    log-level-console=info
    log-level-file=off
    repo1-type=s3
    repo1-path={{ $s.path }}
    repo1-s3-bucket={{ $s.bucket }}
    repo1-s3-endpoint={{ $s.endpoint }}
    repo1-s3-region={{ $s.region }}
    repo1-s3-key-type=shared
    repo1-s3-key={{ $s.accessKey }}
    repo1-s3-key-secret={{ $s.secretKey }}
    {{- if $s.cipherPass }}
    repo1-cipher-type=aes-256-cbc
    repo1-cipher-pass={{ $s.cipherPass }}
    {{- end }}

    [{{ $s.stanza }}]
    pg1-path={{ .Values.postgres.pgdata }}
{{- end }}
