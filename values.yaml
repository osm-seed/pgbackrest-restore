# ${VARS} are filled from the env file by deploy.sh (envsubst). Install with
# deploy.sh, not plain helm, or they stay as literal text.

# Postgres image that matches the source database: same major version, same
# extensions, and pgBackRest installed. osm-seed's web-db image has it.
image:
  name: "${IMAGE}" # full image, e.g. ghcr.io/osm-seed/db:0.1.0
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The pgBackRest repo to restore from. Use keys that can only READ this path:
# see "Never write to the source" in the README.
source:
  stanza: main
  bucket: "${S3_BUCKET}"
  path: "${S3_PATH}"
  region: us-east-1
  endpoint: s3.amazonaws.com
  accessKey: "${S3_ACCESS_KEY}"
  secretKey: "${S3_SECRET_KEY}"
  cipherPass: "${CIPHER_PASS}" # empty if the repo is not encrypted
  # Or bring your own Secret with a `pgbackrest.conf` key, and leave the above empty.
  existingSecret: ""

# Where to stop. All empty: the latest backup plus every WAL after it, then a
# normal database. type standby: never stop, keep applying new WAL from the repo
# until you promote it (./deploy.sh <env> promote). Use it to move a database.
target:
  type: "${TARGET_TYPE}"   # empty | standby
  time: "${TARGET_TIME}"   # "2026-09-30 22:30:00+00", with the time zone
  set: ""                  # a backup label from `pgbackrest info`, e.g. 20260929-191553F

restore:
  # true: restore over a folder that already has a database, downloading only
  # the files that differ (pgbackrest --delta). Use it to turn an earlier
  # restore into a standby without copying everything again.
  delta: "${RESTORE_DELTA}"
  processMax: 4 # parallel downloads

postgres:
  pgdata: /var/lib/postgresql/data/pgdata
  # Passed as `-c key=value`. The source may be tuned for a bigger machine.
  settings:
    shared_buffers: 1GB
    # With hot_standby on, recovery stops if max_connections and friends are
    # lower than on the source. Nothing reads during a one-off restore, so off.
    # A standby turns it on, to be read: match the source with PG_SETTINGS.
    hot_standby: "off"
  # Extra -c settings, comma separated, applied last. For a standby, at least
  # what the source has: max_connections=200,max_worker_processes=2
  settingsList: "${PG_SETTINGS}"
  resources: {}

# Where the restored database lives, as in osm-seed. One per restore: storage
# that already has a database is used as is, not restored again.
cloudProvider: "${CLOUD_PROVIDER}"   # k3s | aws
persistenceDisk:
  # k3s: a folder on the node (static PV), or empty for a local-path PVC
  localVolumeHostPath: "${HOST_PATH}"
  localVolumeSize: "${STORAGE_SIZE}"
  # aws: an existing EBS volume (static PV), or empty for a new one
  AWS_ElasticBlockStore_volumeID: "${EBS_VOLUME_ID}"
  AWS_ElasticBlockStore_size: "${STORAGE_SIZE}"
  storageClassName: "${STORAGE_CLASS}"   # e.g. gp3; empty: the cluster default
  size: "${STORAGE_SIZE}"

# Node to run on, as key=value, e.g. disk=nvme or kubernetes.io/hostname=worker-1.
# With a hostPath folder, pin it to one node: the data only exists there.
nodeSelectorLabel: "${NODE_SELECTOR}"
nodeSelector: {}
tolerations: []
